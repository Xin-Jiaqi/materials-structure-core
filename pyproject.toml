[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "materials-structure-core"
version = "0.0.2"
description = "Validated structure contracts and provenance for materials research software"
authors = [{name = "Jiaqi Xin"}]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: BSD License"]
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
structure-core = "materials_structure_core.cli:main"

[project.optional-dependencies]
io = ["ase>=3.23,<4"]
test = ["ase>=3.23,<4", "pytest>=8,<10", "build>=1.2,<2", "twine>=5,<7"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/materials_structure_core"]
